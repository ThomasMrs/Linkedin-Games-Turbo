<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Games Turbo</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img class="brand-logo" src="icon-48.png" alt="Logo" />
        <div class="brand-text">
          <div class="brand-title-row">
            <h1>LinkedIn Games</h1>
            <span class="badge-turbo">TURBO</span>
          </div>
          <p class="brand-sub" id="status-subtitle">Détection en cours...</p>
        </div>
      </div>
      <div class="daily-pill" id="daily-pill" title="Jeux résolus aujourd'hui">
        <span class="daily-dot"></span>
        <span id="daily-count">0/7</span>
      </div>
    </header>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <section class="hero-card" id="hero-card">
      <div class="hero-top">
        <div class="hero-game">
          <span class="hero-emoji" id="hero-emoji">🎮</span>
          <div>
            <div class="hero-name" id="hero-name">Aucun jeu actif</div>
            <div class="hero-meta" id="hero-meta">Ouvre un jeu LinkedIn ou clique ci-dessous</div>
          </div>
        </div>
        <span class="status-badge" id="hero-badge">En attente</span>
      </div>

      <button class="btn-primary" id="main-action-btn" type="button">
        <span class="btn-primary-left">
          <span id="main-btn-icon">🚀</span>
          <span id="main-btn-label">Lancer le prochain jeu</span>
        </span>
        <span class="kbd-hint" id="main-btn-kbd">Alt+S</span>
      </button>

      <div class="feedback-banner hidden" id="feedback-banner"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title">Jeux quotidiens</span>
        <button class="text-btn" id="next-game-btn" type="button" title="Ouvrir le prochain jeu non terminé">
          Enchaîner →
        </button>
      </div>
      <div class="games-grid" id="games-grid"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title">Vitesse de résolution</span>
        <span class="section-hint" id="speed-desc">Instantané (~0 ms)</span>
      </div>
      <div class="segmented" id="speed-segmented" role="radiogroup">
        <button class="seg-btn" data-speed="turbo" type="button">⚡ Turbo</button>
        <button class="seg-btn" data-speed="fast" type="button">🚀 Rapide</button>
        <button class="seg-btn" data-speed="human" type="button">🧑 Humain</button>
      </div>
    </section>

    <section class="section toggles-card">
      <label class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Auto-Solve</span>
          <span class="toggle-sub">Résout dès l'ouverture du jeu</span>
        </div>
        <input type="checkbox" id="toggle-autoSolve" />
        <span class="switch"></span>
      </label>

      <label class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Auto-Start</span>
          <span class="toggle-sub">Clique seul sur « Commencer »</span>
        </div>
        <input type="checkbox" id="toggle-autoStart" />
        <span class="switch"></span>
      </label>

      <label class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Bouton flottant (HUD)</span>
          <span class="toggle-sub">Mini-barre directe sur LinkedIn</span>
        </div>
        <input type="checkbox" id="toggle-showHud" />
        <span class="switch"></span>
      </label>

      <label class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Raccourci clavier</span>
          <span class="toggle-sub">Résolution rapide avec Alt + S</span>
        </div>
        <input type="checkbox" id="toggle-shortcutEnabled" />
        <span class="switch"></span>
      </label>
    </section>

    <footer class="footer">
      <span id="total-solved-text">Total résolus : 0</span>
      <button class="reset-btn" id="reset-today-btn" type="button" title="Réinitialiser la progression du jour">
        ↺ Réinit. jour
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
